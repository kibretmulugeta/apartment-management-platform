services:
  # 1. FastAPI Web Backend API Service
  - type: web
    name: apparent-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: apparent-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # 2. Celery Asynchronous Background Worker
  - type: worker
    name: apparent-worker
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: apparent-redis
          property: connectionString

# 3. Managed Databases & Caching Services
databases:
  - name: apparent-postgres
    databaseName: property_management
    user: postgres
    region: oregon
    plan: starter

# 4. Redis Caching & Message Broker
services:
  - type: redis
    name: apparent-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
